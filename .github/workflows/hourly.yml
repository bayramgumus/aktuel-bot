name: Aktuel Broşür Botu

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları yükle
        run: pip install requests beautifulsoup4 pillow

      - name: Avcı Modülü (Akakçe Tarama)
        run: python scraper.py

      - name: Tasarım Fabrikası (Post ve Hikaye)
        run: python design_factory.py

      - name: Kuyruk ve hafızayı kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "chore: saatlik broşür kuyruğu güncellendi"
            git push
          fi

      - name: Yayın Motoru (Instagram Post + Hikaye)
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python publisher.py
